name: Kosha
options:
  bundleIdPrefix: app.getkosha
  deploymentTarget:
    iOS: "17.4"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 654ASRW868
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  KoshaKit:
    path: KoshaKit
targets:
  Kosha:
    type: application
    platform: iOS
    sources:
      - path: Kosha
    dependencies:
      - package: KoshaKit
        product: KoshaKit
    entitlements:
      path: Kosha/Kosha.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:getkosha.app
          - webcredentials:getkosha.app
        com.apple.security.application-groups:
          - group.app.getkosha
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.getkosha
    info:
      path: Kosha/Info.plist
      properties:
        CFBundleDisplayName: Kosha
        CFBundleLocalizations: [en, de, es, fr, hi, it, ja, ko, nl, pt, ru, zh]
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: Peacock
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.getkosha.outbox]
        CFBundleURLTypes:
          - CFBundleURLName: app.getkosha
            CFBundleURLSchemes: [app.getkosha]
        NSFaceIDUsageDescription: Kosha uses Face ID to unlock the app.
        NSCameraUsageDescription: Kosha uses the camera to scan receipts and attach bills.
        NSPhotoLibraryUsageDescription: Kosha attaches photos of receipts and bills that you choose.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.getkosha
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
  KoshaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KoshaUITests
    dependencies:
      - target: Kosha
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.getkosha.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Kosha:
    build:
      targets:
        Kosha: all
        KoshaUITests: [test]
    test:
      targets:
        - KoshaUITests
    run:
      config: Debug
