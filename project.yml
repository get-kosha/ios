name: Kosha
options:
  bundleIdPrefix: app.getkosha
  deploymentTarget:
    iOS: "17.4"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 654ASRW868
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  KoshaKit:
    path: KoshaKit
targets:
  Kosha:
    type: application
    platform: iOS
    sources:
      - path: Kosha
    dependencies:
      - package: KoshaKit
        product: KoshaKit
      - target: KoshaWidgets
    entitlements:
      path: Kosha/Kosha.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:getkosha.app
          - webcredentials:getkosha.app
        com.apple.security.application-groups:
          - group.app.getkosha
        keychain-access-groups:
          - $(AppIdentifierPrefix)app.getkosha
    info:
      path: Kosha/Info.plist
      properties:
        CFBundleDisplayName: Kosha
        CFBundleLocalizations: [en, de, es, fr, hi, it, ja, ko, nl, pt, ru, zh]
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: Peacock
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.getkosha.outbox]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Bank statement
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.comma-separated-values-text, com.adobe.pdf, app.getkosha.ofx, app.getkosha.qfx]
        LSSupportsOpeningDocumentsInPlace: false
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: app.getkosha.ofx
            UTTypeConformsTo: [public.data, public.text]
            UTTypeDescription: OFX statement
            UTTypeTagSpecification: { public.filename-extension: [ofx] }
          - UTTypeIdentifier: app.getkosha.qfx
            UTTypeConformsTo: [public.data, public.text]
            UTTypeDescription: QFX statement
            UTTypeTagSpecification: { public.filename-extension: [qfx] }
        CFBundleURLTypes:
          - CFBundleURLName: app.getkosha
            CFBundleURLSchemes: [app.getkosha]
        NSFaceIDUsageDescription: Kosha uses Face ID to unlock the app.
        NSCameraUsageDescription: Kosha uses the camera to scan receipts and attach bills.
        NSPhotoLibraryUsageDescription: Kosha attaches photos of receipts and bills that you choose.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.getkosha
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
  KoshaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: KoshaWidgets
    dependencies:
      - package: KoshaKit
        product: KoshaWidgetKit
    entitlements:
      path: KoshaWidgets/KoshaWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.getkosha
    info:
      path: KoshaWidgets/Info.plist
      properties:
        CFBundleDisplayName: Kosha
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.getkosha.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
  KoshaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KoshaUITests
    dependencies:
      - target: Kosha
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.getkosha.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  # The app, and KoshaKit's unit tests on the simulator: what Xcode Cloud runs on every push to main.
  Kosha:
    build:
      targets:
        Kosha: all
    test:
      gatherCoverageData: false
      targets:
        - package: KoshaKit/ModelTests
        - package: KoshaKit/DesignTests
        - package: KoshaKit/StoreTests
        - package: KoshaKit/FeaturesTests
    run:
      config: Debug
    archive:
      config: Release
  # The screenshot tour (KoshaUITests): needs a Kosha dev server at localhost:3000, so it runs by hand.
  KoshaTour:
    build:
      targets:
        Kosha: all
        KoshaUITests: [test]
    test:
      targets:
        - KoshaUITests
